# ros2:base-humble-amd64
# Запуск: docker compose up -d / exec base-humble-amd64 bash / down. Подробности в README.md.
# Образы собирай скриптом ./build_image.sh (compose используй только для запуска).
services:
  base-humble-amd64:
    image: ros2:base-humble-amd64
    container_name: ros2-base-humble-amd64
    build:
      context: .
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    # runtime: nvidia         # раскомментируй на хосте с nvidia-рантаймом (Jetson с JetPack 6, GPU-сервер)
    network_mode: host          # ноды видят хост и сеть без проброса портов (DDS)
    ipc: host
    privileged: true            # доступ к камерам и USB
    stdin_open: true
    tty: true
    restart: unless-stopped     # контейнер сам поднимается после перезагрузки хоста
    volumes:
      - /dev:/dev
      - ./src:/developer_ws/src
      - ./files_to_container:/files_to_container
      - ./ros2_custom_config_setup:/ros2_custom_config_setup
